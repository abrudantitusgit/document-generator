services:
  db:
    image: postgres:16-alpine
    container_name: scanner-doc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ovinstal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ovinstal-local}
      POSTGRES_DB: ${POSTGRES_DB:-ovinstal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ovinstal} -d ${POSTGRES_DB:-ovinstal}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend/InterfataActe/InterfataActe
    container_name: scanner-doc-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-ovinstal};Username=${POSTGRES_USER:-ovinstal};Password=${POSTGRES_PASSWORD:-ovinstal-local};SearchPath=first
    volumes:
      - app_temp:/mnt/share/temp
      - app_bransamente:/mnt/share/clientiBransamente
      - app_fotovoltaice:/mnt/share/clientiFotovoltaice
    ports:
      - "5000:5000"

  id-ocr:
    build:
      context: ./backend/IdCardOcr
    container_name: scanner-doc-id-ocr
    restart: unless-stopped
    environment:
      # auto = gpu:0 when visible, else CPU; set to cpu to force it. Hosts without an
      # NVIDIA driver need the CPU image (docker-compose.cpu.yml).
      OCR_DEVICE: ${OCR_DEVICE:-auto}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "127.0.0.1:5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6

  frontend:
    build:
      context: ./react
    container_name: scanner-doc-web
    restart: unless-stopped
    depends_on:
      - backend
      - id-ocr
    ports:
      - "3000:80"

volumes:
  postgres_data:
  app_temp:
  app_bransamente:
  app_fotovoltaice:
