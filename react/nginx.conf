server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ID card OCR runs in its own container; proxying keeps it reachable from other LAN devices.
    location /ocr/ {
        proxy_pass http://id-ocr:5001/;
        client_max_body_size 10m;
        proxy_read_timeout 120s;
    }
}
